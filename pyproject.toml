[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nervemind-cgos"
version = "0.1.0"
description = "Enterprise runtime governance SDK for supervised AI systems, policy-controlled execution, and operational oversight."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NerveMind AI, Inc.", email = "support@nervemindai.com" }]
maintainers = [{ name = "NerveMind AI, Inc.", email = "support@nervemindai.com" }]
keywords = [
  "cgos",
  "runtime-governance",
  "ai-governance",
  "policy-enforcement",
  "enterprise-ai",
  "human-in-the-loop",
  "audit",
  "nervemind",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = ["requests>=2.28.0,<3"]

[project.urls]
Homepage = "https://github.com/nervemind/nervemind-cgos"
Repository = "https://github.com/nervemind/nervemind-cgos"
Documentation = "https://nervemindos.com/resources/documentation"
"Bug Tracker" = "https://github.com/nervemind/nervemind-cgos/issues"
"Integration Guides" = "https://nervemindos.com/developers/integration-guides"

[project.optional-dependencies]
dev = ["pytest>=7.0", "responses>=0.25"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cgos_sdk*"]
